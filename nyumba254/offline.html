<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="robots" content="noindex">
<title>You're offline | Nyumba254</title>
<style>
  :root {
    --bg: #06231c;
    --surface: #0b3429;
    --text: #e8f4ef;
    --muted: #9cc4b6;
    --accent: #1D9E75;
    --accent-text: #ffffff;
    --border: #14503f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --text: #1a1a18;
      --muted: #55625d;
      --accent: #0F6E56;
      --accent-text: #ffffff;
      --border: #dcd9cf;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: left;
  }
  .brand {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 1.5rem;
    margin: 0 0 24px;
  }
  h1 {
    font-size: 1.25rem;
    line-height: 1.3;
    margin: 0 0 8px;
  }
  p {
    margin: 0 0 24px;
    line-height: 1.55;
    color: var(--muted);
  }
  button {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-text);
    border: 0;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .status { margin-top: 16px; font-size: .875rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
  <main>
    <p class="brand">Nyumba254</p>
    <h1>No internet connection</h1>
    <p>Listings and messages need a connection to load. Check your data or Wi-Fi, then try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
<script>
  var status = document.getElementById('status');
  document.getElementById('retry').addEventListener('click', function () {
    if (navigator.onLine) {
      status.textContent = 'Reconnecting…';
      location.reload();
    } else {
      status.textContent = 'Still offline.';
    }
  });
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
